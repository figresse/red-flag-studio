{% extends 'redflagstudio/base.html' %}

{% block content %}
    <h4>DataBase List :</h4>
    {% for post in posts %}
    <article>
        <time>published: {{ post.published_date }}</time>
        <h2><a href="">[ {{ post.title }} ]</a></h2>
        <p>{{ post.text|linebreaksbr }}</p>
    </article>
{% endfor %}
{% endblock %}
